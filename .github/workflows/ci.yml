name: PC Report Deployment Experiment
on:
  push:
    branches: [ci/pc-report-alignment]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pc-report-deployment
  cancel-in-progress: false
jobs:
  test:
    name: Python 3.12 / SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ""
      PDM_TEST_DATABASE_URL: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m pytest -q -p no:cacheprovider
  deploy:
    name: Deploy / ${{ matrix.runner }}
    needs: test
    if: github.repository == 'pengqut/personal-document-manager' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/pc-report-alignment'
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        runner: [pc-cd-app1, pc-cd-app2]
    runs-on: [self-hosted, linux, x64, "${{ matrix.runner }}"]
    timeout-minutes: 10
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy the PC application with PM2
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: bash .github/scripts/deploy-pc-report.sh
