name: Python Tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ""
      PDM_TEST_DATABASE_URL: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # PostgreSQL row-lock tests are skipped without a dedicated test database.
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
