name: Deploy

# Tests run first. The deploy job then installs the app on an EC2 instance
# that already exists and keeps running after the job (it is not deleted).
#
# The instance has no key pair. The job uses EC2 Instance Connect to push a
# one-time SSH public key, which is valid for 60 seconds per connection.
# The instance must run Ubuntu and its security group must allow SSH (22)
# and HTTP (80) from the internet.
#
# On the instance: PostgreSQL on port 5001 (local connections only), the app
# in /home/ubuntu/A2-PDM under PM2 on port 80. Assignment 1 is not touched.
# Health check: GET /api/admin/setup-status.
#
# Academy credentials are temporary. Enter them on the Run workflow form.
# Copy the access key, secret key, and session token from AWS Details.

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: AWS access key ID from the current Academy session
        required: true
        type: string
      aws_secret_access_key:
        description: AWS secret access key from the current Academy session
        required: true
        type: string
      aws_session_token:
        description: AWS session token from the current Academy session
        required: true
        type: string
      aws_region:
        description: Region of the EC2 instance
        required: true
        default: ap-southeast-2
        type: string
      instance_id:
        description: EC2 instance to deploy to
        required: true
        default: i-0d1cc054c82f6b5c8
        type: string

permissions:
  contents: read

concurrency:
  group: pdm-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Python 3.12 / SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ""
      PDM_TEST_DATABASE_URL: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_id }}
      AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key }}
      AWS_SESSION_TOKEN: ${{ inputs.aws_session_token }}
      AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
      INSTANCE_ID: ${{ inputs.instance_id }}
      SSH_USER: ubuntu
      GIT_SHA: ${{ github.sha }}
      REPO_URL: https://github.com/${{ github.repository }}

    steps:
      - name: Hide the Academy credentials in the log
        run: |
          echo "::add-mask::${{ inputs.aws_access_key_id }}"
          echo "::add-mask::${{ inputs.aws_secret_access_key }}"
          echo "::add-mask::${{ inputs.aws_session_token }}"

      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find the instance
        run: |
          state="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)"
          if [ "$state" = "stopped" ]; then
            echo "Starting ${INSTANCE_ID}."
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
          fi
          aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"

          read -r ip image name <<<"$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].[PublicIpAddress,ImageId,Tags[?Key==`Name`]|[0].Value]' \
            --output text)"
          if [ -z "$ip" ] || [ "$ip" = "None" ]; then
            echo "${INSTANCE_ID} has no public IPv4 address." >&2
            exit 1
          fi
          image_name="$(aws ec2 describe-images --image-ids "$image" \
            --query 'Images[0].Name' --output text 2>/dev/null || true)"
          case "$image_name" in
            *ubuntu*) ;;
            *) echo "Image ${image} (${image_name}) does not look like Ubuntu. The scripts expect Ubuntu." ;;
          esac
          if [ -z "$name" ] || [ "$name" = "None" ]; then
            name="$INSTANCE_ID"
          fi
          echo "Instance ${INSTANCE_ID} (${name}) at ${ip}"
          {
            echo "APP_IP=${ip}"
            echo "APP_NAME=${name}"
          } >> "$GITHUB_ENV"

      - name: Prepare a one-time SSH key
        run: |
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/pdm_key"
          cat > "$RUNNER_TEMP/remote.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$INSTANCE_ID" \
            --instance-os-user "$SSH_USER" \
            --ssh-public-key "file://${RUNNER_TEMP}/pdm_key.pub" >/dev/null
          exec ssh -i "${RUNNER_TEMP}/pdm_key" \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="${RUNNER_TEMP}/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "${SSH_USER}@${APP_IP}" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/remote.sh"
          "$RUNNER_TEMP/remote.sh" 'echo "Connected to $(hostname)"'

      - name: Install PostgreSQL and the app
        run: |
          args="$(printf '%q ' "$REPO_URL" "$GIT_SHA" "$APP_NAME")"
          "$RUNNER_TEMP/remote.sh" "bash -s -- ${args}" < .github/scripts/server-deploy.sh

      - name: PM2 status
        run: '"$RUNNER_TEMP/remote.sh" sudo pm2 status'

      - name: Check the public address
        run: |
          echo "Open http://${APP_IP} in a browser."
          curl --retry 10 --retry-delay 5 --retry-all-errors -sS -D - \
            "http://${APP_IP}/api/admin/setup-status"
          echo

      - name: Run the two Apache Benchmark tests
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y apache2-utils
          echo "Baseline: 100 requests, concurrency 5"
          ab -n 100 -c 5 "http://${APP_IP}/api/admin/setup-status"
          echo "Higher load: 500 requests, concurrency 20"
          ab -n 500 -c 20 "http://${APP_IP}/api/admin/setup-status"

      - name: Read CloudWatch CPU
        continue-on-error: true
        run: |
          echo "Waiting 3 minutes so the CloudWatch CPU graph can show the load test."
          sleep 180
          end="$(date -u +%Y-%m-%dT%H:%M:%S)"
          start="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%S)"
          aws cloudwatch get-metric-statistics \
            --namespace AWS/EC2 --metric-name CPUUtilization \
            --dimensions "Name=InstanceId,Value=${INSTANCE_ID}" \
            --start-time "$start" --end-time "$end" \
            --period 60 --statistics Average Maximum
