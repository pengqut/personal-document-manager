name: Deploy


on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: AWS access key ID from the current Academy session
        required: true
        type: string
      aws_secret_access_key:
        description: AWS secret access key from the current Academy session
        required: true
        type: string
      aws_session_token:
        description: AWS session token from the current Academy session
        required: true
        type: string
      aws_region:
        description: Region of the EC2 instances
        required: true
        default: ap-southeast-2
        type: string
      instance_id:
        description: App-1 instance (also hosts PostgreSQL)
        required: true
        default: i-09e52d6ce18896af6
        type: string
      app2_subnet:
        description: Subnet Name tag or ID for App-2 (another Availability Zone)
        required: true
        default: aws-controltower-PublicSubnet2
        type: string
      security_group:
        description: Security group name or ID for both servers and the load balancer
        required: true
        default: student-allowed-sg-5
        type: string

permissions:
  contents: read

concurrency:
  group: pdm-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Python 3.12 / SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ""
      PDM_TEST_DATABASE_URL: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  deploy:
    name: Deploy behind the load balancer
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_id }}
      AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key }}
      AWS_SESSION_TOKEN: ${{ inputs.aws_session_token }}
      AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
      INSTANCE_ID: ${{ inputs.instance_id }}
      APP2_NAME: Group19-App2
      APP2_SUBNET: ${{ inputs.app2_subnet }}
      SECURITY_GROUP: ${{ inputs.security_group }}
      SSH_USER: ubuntu
      GIT_SHA: ${{ github.sha }}
      REPO_URL: https://github.com/${{ github.repository }}

    steps:
      - name: Hide the Academy credentials in the log
        run: |
          echo "::add-mask::${{ inputs.aws_access_key_id }}"
          echo "::add-mask::${{ inputs.aws_secret_access_key }}"
          echo "::add-mask::${{ inputs.aws_session_token }}"

      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find App-1 and find or launch App-2
        run: bash .github/scripts/find-servers.sh

      - name: Security group rules
        run: bash .github/scripts/open-ports.sh

      - name: Prepare the SSH key
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$EC2_SSH_PRIVATE_KEY" ]; then
            echo "Add the instance's .pem file as the repository secret EC2_SSH_PRIVATE_KEY." >&2
            exit 1
          fi
          (umask 077 && printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/pdm_key")
          cat > "$RUNNER_TEMP/remote.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          host="$1"
          shift
          exec ssh -i "${RUNNER_TEMP}/pdm_key" \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="${RUNNER_TEMP}/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "${SSH_USER}@${host}" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/remote.sh"
          for host in "$APP1_IP" "$APP2_IP"; do
            for try in 1 2 3 4 5 6; do
              if "$RUNNER_TEMP/remote.sh" "$host" 'echo "Connected to $(hostname)"'; then
                break
              fi
              if [ "$try" -eq 6 ]; then
                echo "Cannot reach ${host} on port 22." >&2
                exit 1
              fi
              sleep 10
            done
          done

      - name: Install PostgreSQL and the app on App-1
        run: |
          args="$(printf '%q ' "$REPO_URL" "$GIT_SHA" "$APP1_NAME" db "$VPC_CIDR")"
          "$RUNNER_TEMP/remote.sh" "$APP1_IP" "bash -s -- ${args}" < .github/scripts/server-deploy.sh

      - name: Install the app on App-2
        run: |
          password="$("$RUNNER_TEMP/remote.sh" "$APP1_IP" cat /home/ubuntu/A2-runtime/db.password)"
          echo "::add-mask::${password}"
          url="postgresql://pdm_user:${password}@${APP1_PRIVATE_IP}:5001/pdm_prod"
          args="$(printf '%q ' "$REPO_URL" "$GIT_SHA" "$APP2_NAME" app)"
          { printf 'export DATABASE_URL=%q\n' "$url"; cat .github/scripts/server-deploy.sh; } \
            | "$RUNNER_TEMP/remote.sh" "$APP2_IP" "bash -s -- ${args}"

      - name: PM2 status on both servers
        run: |
          echo "PM2 status on ${APP1_NAME} (${APP1_IP})"
          "$RUNNER_TEMP/remote.sh" "$APP1_IP" sudo pm2 status
          echo "PM2 status on ${APP2_NAME} (${APP2_IP})"
          "$RUNNER_TEMP/remote.sh" "$APP2_IP" sudo pm2 status

      - name: Load balancer
        run: bash .github/scripts/ensure-alb.sh

      - name: Requests through the load balancer
        run: |
          echo "${APP1_NAME}  http://${APP1_IP}"
          echo "${APP2_NAME}  http://${APP2_IP}"
          echo "Load balancer  http://${ALB_DNS}"
          # The lab network can drop traffic from GitHub's runners even when the
          # security group allows it. Then the requests and the load test are
          # skipped here and run from a local terminal instead.
          if ! curl -sS --connect-timeout 10 -m 20 -o /dev/null "http://${ALB_DNS}/api/admin/setup-status"; then
            echo "LOAD_FROM_RUNNER=0" >> "$GITHUB_ENV"
            echo "::warning::The runner cannot reach the load balancer. Run the requests and ab from a local terminal."
            exit 0
          fi
          echo "LOAD_FROM_RUNNER=1" >> "$GITHUB_ENV"
          for n in $(seq 1 10); do
            server="$(curl -sS --connect-timeout 10 -o /dev/null -D - "http://${ALB_DNS}/api/admin/setup-status" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="x-pdm-instance" {print $2}')"
            echo "request ${n} answered by ${server}"
          done

      - name: Run the two Apache Benchmark tests
        if: env.LOAD_FROM_RUNNER == '1'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y apache2-utils
          date -u +"Load test started %Y-%m-%d %H:%M:%S UTC"
          echo "Baseline: 100 requests, concurrency 5"
          ab -n 100 -c 5 "http://${ALB_DNS}/api/admin/setup-status"
          echo "Higher load: 500 requests, concurrency 20"
          ab -n 500 -c 20 "http://${ALB_DNS}/api/admin/setup-status"
          date -u +"Load test finished %Y-%m-%d %H:%M:%S UTC"

      - name: Read CloudWatch CPU
        continue-on-error: true
        run: |
          echo "Waiting 3 minutes so the CloudWatch CPU graph can show the load test."
          sleep 180
          end="$(date -u +%Y-%m-%dT%H:%M:%S)"
          start="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%S)"
          for pair in "${APP1_ID}:${APP1_NAME}" "${APP2_ID}:${APP2_NAME}"; do
            echo "CPU ${pair#*:} (${pair%%:*})"
            aws cloudwatch get-metric-statistics \
              --namespace AWS/EC2 --metric-name CPUUtilization \
              --dimensions "Name=InstanceId,Value=${pair%%:*}" \
              --start-time "$start" --end-time "$end" \
              --period 60 --statistics Average Maximum \
              --query 'sort_by(Datapoints,&Timestamp)[].[Timestamp,Average,Maximum]' --output table
          done

      - name: Remove the runner's rules
        if: always() && (env.RUNNER_SSH_RULE == '1' || env.RUNNER_HTTP_RULE == '1')
        run: |
          for port in 22 80; do
            if [ "$port" = 22 ] && [ "${RUNNER_SSH_RULE:-}" != 1 ]; then continue; fi
            if [ "$port" = 80 ] && [ "${RUNNER_HTTP_RULE:-}" != 1 ]; then continue; fi
            aws ec2 revoke-security-group-ingress --group-id "$PDM_SG" \
              --protocol tcp --port "$port" --cidr "$RUNNER_CIDR" >/dev/null \
              && echo "Removed port ${port} access for ${RUNNER_CIDR}." \
              || echo "Could not remove port ${port} access for ${RUNNER_CIDR} on ${PDM_SG}. Remove it in the console."
          done
