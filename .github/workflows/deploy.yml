name: Deploy

# Tests run first. This run launches the servers inside the VPC that
# already exists in the student account, then deletes those servers before
# the job ends. The student role cannot create a VPC, and this workflow
# does not delete the lab network.
#
# Created for the run: one PostgreSQL instance on port 5001, two app
# instances with PM2, and an internet-facing Application Load Balancer.
# The student role cannot create a security group or add inbound rules.
# Instances use the default group, install the app at boot, and can reach
# each other. Port 80 stays closed to the internet.
# Health check: GET /api/admin/setup-status.
#
# Academy credentials are temporary. Enter them on the Run workflow form.
# Copy the access key, secret key, and session token from AWS Details.

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: AWS access key ID from the current Academy session
        required: true
        type: string
      aws_secret_access_key:
        description: AWS secret access key from the current Academy session
        required: true
        type: string
      aws_session_token:
        description: AWS session token from the current Academy session
        required: true
        type: string
      aws_region:
        description: Region shown in the Academy lab (often us-east-1)
        required: true
        default: us-east-1
        type: string
      instance_type:
        description: EC2 size for the database and both app servers
        required: true
        default: t3.medium
        type: string
      screenshot_minutes:
        description: Minutes to leave the lab up for screenshots before deletion
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: pdm-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Python 3.12 / SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ""
      PDM_TEST_DATABASE_URL: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  deploy:
    name: Create, deploy, then delete the lab
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_id }}
      AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_access_key }}
      AWS_SESSION_TOKEN: ${{ inputs.aws_session_token }}
      AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
      INSTANCE_TYPE: ${{ inputs.instance_type }}
      GIT_SHA: ${{ github.sha }}
      REPO_URL: https://github.com/${{ github.repository }}

    steps:
      - name: Hide the Academy credentials in the log
        run: |
          echo "::add-mask::${{ inputs.aws_access_key_id }}"
          echo "::add-mask::${{ inputs.aws_secret_access_key }}"
          echo "::add-mask::${{ inputs.aws_session_token }}"

      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create the network, database, and both app servers
        run: bash .github/scripts/lab-up.sh

      - name: Create the load balancer
        run: bash .github/scripts/lab-alb.sh

      - name: Leave the lab up for screenshots
        run: |
          # shellcheck disable=SC1091
          source pdm-lab.env
          echo "PDM-App-1 http://${APP1_IP}"
          echo "PDM-App-2 http://${APP2_IP}"
          echo "Load balancer http://${ALB_DNS}"
          echo "Open this public URL in a browser: ${PUBLIC_URL}"
          echo "Both targets are healthy. Take the EC2, target group, and load balancer screenshots now."
          for n in 1 2 3 4 5 6; do
            echo "request ${n}"
            curl --retry 5 --retry-delay 5 --retry-all-errors -sS -D - "http://${ALB_DNS}/api/admin/setup-status" -o /tmp/body.json
            echo
          done
          minutes="${{ inputs.screenshot_minutes }}"
          if ! [[ "$minutes" =~ ^[0-9]+$ ]]; then
            minutes=10
          fi
          echo "The load test starts after ${minutes} minutes. The lab is deleted after that test."
          sleep $((minutes * 60))

      - name: Run the two Apache Benchmark tests
        run: |
          # shellcheck disable=SC1091
          source pdm-lab.env
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y apache2-utils
          echo "Baseline: 100 requests, concurrency 5"
          ab -n 100 -c 5 "http://${ALB_DNS}/api/admin/setup-status"
          echo "Higher load: 500 requests, concurrency 20"
          ab -n 500 -c 20 "http://${ALB_DNS}/api/admin/setup-status"

      - name: Read CloudWatch CPU for both app servers
        run: |
          # shellcheck disable=SC1091
          source pdm-lab.env
          echo "Waiting 3 minutes so the CloudWatch CPU graph can show the load test."
          sleep 180
          end="$(date -u +%Y-%m-%dT%H:%M:%S)"
          start="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%S)"
          for instance_id in "$APP1_ID" "$APP2_ID"; do
            echo "CPU ${instance_id}"
            aws cloudwatch get-metric-statistics \
              --namespace AWS/EC2 --metric-name CPUUtilization \
              --dimensions "Name=InstanceId,Value=${instance_id}" \
              --start-time "$start" --end-time "$end" \
              --period 60 --statistics Average Maximum
          done

      - name: Delete the lab
        if: always()
        run: |
          if [ -f .github/scripts/lab-down.sh ]; then
            bash .github/scripts/lab-down.sh
          fi
