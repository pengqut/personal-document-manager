$kind: http-request
url: '{{base_url}}/api/login'
method: POST
body:
  type: json
  content: |-
    {
      "username": "A2Test01",
      "password": "Testpassword123"
    }
scripts:
- type: afterResponse
  code: "let response = pm.response.json();\r\n\r\npm.test(\"Status code is 200\", function () {\r\n    pm.response.to.have.status(200);\r\n});\r\n\r\npm.test(\"Content-Type is present\", function () {\r\n    pm.response.to.have.header(\"Content-Type\");\r\n});\r\n\r\npm.test(\"Login is successful\", function () {\r\n    pm.expect(response.ok).to.eql(true);\r\n});\r\n\r\npm.test(\"Correct username is returned\", function () {\r\n    pm.expect(response.username).to.eql(\"A2Test01\");\r\n});"
  language: text/javascript
order: 1000
headers:
- key: Content-Type
  value: application/json
