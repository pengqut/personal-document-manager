$kind: http-request
url: '{{base_url}}/api/login'
method: POST
body:
  type: raw
  content: |-
    {
      "username": "A2Test01",
      "password": "Testpassword123wrong"
    }
  options:
    raw:
      language: json
scripts:
- type: afterResponse
  code: "let response = pm.response.json();\r\n\r\npm.test(\"Status code is 401\", function () {\r\n    pm.response.to.have.status(401);\r\n});\r\n\r\npm.test(\"Content-Type is present\", function () {\r\n    pm.response.to.have.header(\"Content-Type\");\r\n});\r\n\r\npm.test(\"Incorrect credentials are rejected\", function () {\r\n    pm.expect(response.error).to.eql(\r\n        \"Username or password is incorrect.\"\r\n    );\r\n});"
  language: text/javascript
order: 3000
headers:
- key: Content-Type
  value: application/json
