$kind: http-request
url: '{{base_url}}/api/register'
method: POST
body:
  type: json
  content: |-
    {
      "username": "A2Test01",
      "password": "Testpassword123"
    }
scripts:
- type: afterResponse
  code: "let response = pm.response.json();\r\n\r\npm.test(\"Status code is 409\", function () {\r\n    pm.response.to.have.status(409);\r\n});\r\n\r\npm.test(\"Content-Type is present\", function () {\r\n    pm.response.to.have.header(\"Content-Type\");\r\n});\r\n\r\npm.test(\"Duplicate username is rejected\", function () {\r\n    pm.expect(response.error).to.eql(\"Username already exists.\");\r\n});"
  language: text/javascript
order: 3000
headers:
- key: Content-Type
  value: application/json
