$kind: http-request
url: '{{base_url}}/api/register'
method: POST
body:
  type: json
  content: |-
    {
      "username": "A2Test01234",
      "password": "Testpassword123"
    }
scripts:
- type: afterResponse
  code: "let response = pm.response.json();\r\n\r\npm.test(\"Status code is 400\", function () {\r\n    pm.response.to.have.status(400);\r\n});\r\n\r\npm.test(\"Content-Type is present\", function () {\r\n    pm.response.to.have.header(\"Content-Type\");\r\n});\r\n\r\npm.test(\"Validation error is returned\", function () {\r\n    pm.expect(response).to.have.property(\"error\");\r\n});"
  language: text/javascript
order: 1000
headers:
- key: Content-Type
  value: application/json
