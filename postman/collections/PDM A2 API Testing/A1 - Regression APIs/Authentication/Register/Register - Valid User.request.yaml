$kind: http-request
url: "{{base_url}}/api/register"
method: POST
body:
  type: urlencoded
  content:
    username: A2Test01
    password: Testpassword123
scripts:
  - type: afterResponse
    code: "let response = pm.response.json();\r

      \r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Content-Type is present\", function () {\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      });\r

      \r

      pm.test(\"Registration is successful\", function () {\r

      \    pm.expect(response.ok).to.eql(true);\r

      });"
    language: text/javascript
order: 4000
