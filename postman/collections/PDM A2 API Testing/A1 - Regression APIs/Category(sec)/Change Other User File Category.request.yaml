$kind: http-request
url: '{{base_url}}/api/files/{{test_file_id}}/category'
method: POST
body:
  type: json
  content: |-
    {
      "category": "document"
    }
scripts:
- type: afterResponse
  code: "let response = pm.response.json();\r\n\r\npm.test(\"Status code is 404\", function () {\r\n    pm.response.to.have.status(404);\r\n});\r\n\r\npm.test(\"Other user's file cannot be modified\", function () {\r\n    pm.expect(response.error).to.eql(\"File not found.\");\r\n});"
  language: text/javascript
order: 5000
headers:
- key: Content-Type
  value: application/json
