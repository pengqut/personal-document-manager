$kind: http-request
url: "{{base_url}}/api/files"
method: GET
scripts:
  - type: afterResponse
    code: "let response = pm.response.json();\r

      \r

      let testFile = response.files.find(\r

      \    file => file.id == pm.environment.get(\"test_file_id\")\r

      );\r

      \r

      pm.test(\"Test file is found\", function () {\r

      \    pm.expect(testFile).to.exist;\r

      });\r

      \r

      pm.test(\"Updated category is returned\", function () {\r

      \    pm.expect(testFile.category).to.eql(\"image\");\r

      });"
    language: text/javascript
order: 4000
