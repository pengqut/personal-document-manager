$kind: http-request
url: "{{base_url}}/api/download/{{test_file_id}}"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Content-Type is present\", function () {\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      });\r

      \r

      pm.test(\"Downloaded file content is correct\", function () {\r

      \    pm.expect(pm.response.text()).to.include(\"Postman API test
      file\");\r

      });"
    language: text/javascript
order: 2000
