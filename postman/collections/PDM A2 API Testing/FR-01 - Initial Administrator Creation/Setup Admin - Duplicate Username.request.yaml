$kind: http-request
url: "{{base_url}}/api/admin/setup"
method: POST
body:
  type: urlencoded
  content:
    - key: username
      value: "{{setup_existing_username}}"
    - key: password
      value: "Abcdefg1"
scripts:
  - type: beforeRequest
    code: "// Optional fixture: an existing normal username while setup is still open.\nif (!pm.environment.get('setup_existing_username')) {\n    console.info('Skipped: set setup_existing_username to run the duplicate-name scenario.');\n    pm.execution.skipRequest();\n}"
    language: text/javascript
  - type: afterResponse
    code: "pm.test('Status code is 409', function () {\n    pm.response.to.have.status(409);\n});\npm.test('Expected setup error is returned', function () {\n    pm.expect(pm.response.json().error).to.eql(\"Username already exists.\");\n});\n\npm.sendRequest({\n    url: pm.variables.replaceIn('{{base_url}}/api/admin/setup-status'),\n    method: 'GET'\n}, function (error, result) {\n    pm.test('Setup status request succeeds', function () {\n        pm.expect(error).to.eql(null);\n        pm.expect(result.code).to.eql(200);\n    });\n    if (!error && result) {\n        pm.test('Setup initialized is false', function () {\n            pm.expect(result.json().initialized).to.eql(false);\n        });\n    }\n});"
    language: text/javascript
order: 3000
