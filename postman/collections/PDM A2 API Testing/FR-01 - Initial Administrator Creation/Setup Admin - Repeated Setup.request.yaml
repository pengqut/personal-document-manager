$kind: http-request
url: "{{base_url}}/api/admin/setup"
method: POST
body:
  type: urlencoded
  content:
    - key: username
      value: "admin002"
    - key: password
      value: "Abcdefg1"
scripts:
  - type: afterResponse
    code: "pm.test('Status code is 409', function () {\n    pm.response.to.have.status(409);\n});\npm.test('Expected setup error is returned', function () {\n    pm.expect(pm.response.json().error).to.eql(\"Administrator setup is already complete.\");\n});\n\npm.sendRequest({\n    url: pm.variables.replaceIn('{{base_url}}/api/admin/setup-status'),\n    method: 'GET'\n}, function (error, result) {\n    pm.test('Setup status request succeeds', function () {\n        pm.expect(error).to.eql(null);\n        pm.expect(result.code).to.eql(200);\n    });\n    if (!error && result) {\n        pm.test('Setup initialized is true', function () {\n            pm.expect(result.json().initialized).to.eql(true);\n        });\n    }\n});"
    language: text/javascript
order: 5000
