# Run this folder in saved order against a development/test database only.
$kind: http-request
url: "{{base_url}}/api/admin/me"
method: GET
headers:
  - key: Cookie
    value: "token={{user_token}}"
scripts:
  - type: afterResponse
    code: "pm.test('Status code is 403', function () {\n    pm.response.to.have.status(403);\n});\npm.test('Expected error is returned', function () {\n    pm.expect(pm.response.json().error).to.eql(\"Administrator rights are required.\");\n});"
    language: text/javascript
order: 8000
