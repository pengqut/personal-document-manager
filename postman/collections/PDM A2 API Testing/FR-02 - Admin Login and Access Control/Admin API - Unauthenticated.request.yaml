# Run this folder in saved order against a development/test database only.
$kind: http-request
url: "{{base_url}}/api/admin/me"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('Status code is 401', function () {\n    pm.response.to.have.status(401);\n});\npm.test('Expected error is returned', function () {\n    pm.expect(pm.response.json().error).to.eql(\"Not logged in.\");\n});"
    language: text/javascript
order: 3000
