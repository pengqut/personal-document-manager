# Development/test database only. Run first; existing administrators are never overwritten.
$kind: http-request
url: "{{base_url}}/api/admin/setup-status"
method: GET
scripts:
  - type: beforeRequest
    code: "// Development/test database only. Existing administrator credentials are never reset.\npm.variables.set('fr02_admin_username', pm.environment.get('admin_username') || 'admin001');\npm.variables.set('fr02_admin_password', pm.environment.get('admin_password') || 'Abcdefg1');"
    language: text/javascript
  - type: afterResponse
    code: "pm.test('Setup status is available', function () {\n    pm.response.to.have.status(200);\n    pm.expect(typeof pm.response.json().initialized).to.eql('boolean');\n});\n\nfunction verifyAdministrator() {\n    pm.sendRequest({\n        url: pm.variables.replaceIn('{{base_url}}/api/admin/login'),\n        method: 'POST',\n        body: {\n            mode: 'urlencoded',\n            urlencoded: [\n                {key: 'username', value: pm.variables.get('fr02_admin_username')},\n                {key: 'password', value: pm.variables.get('fr02_admin_password')}\n            ]\n        }\n    }, function (error, result) {\n        pm.test('Prepared administrator accepts the configured credentials', function () {\n            pm.expect(error).to.eql(null);\n            pm.expect(result.code).to.eql(200);\n            pm.expect(result.json().ok).to.eql(true);\n            pm.expect(result.json().username).to.eql(pm.variables.get('fr02_admin_username'));\n        });\n        if (error || !result || result.code !== 200) return;\n        var match = (result.headers.get('Set-Cookie') || '').match(/token=([a-f0-9]{32})/);\n        pm.test('Administrator preparation returns a session', function () {\n            pm.expect(Boolean(match)).to.eql(true);\n        });\n        if (!match) return;\n        pm.sendRequest({\n            url: pm.variables.replaceIn('{{base_url}}/api/logout'),\n            method: 'POST',\n            header: {Cookie: 'token=' + match[1]}\n        }, function (logoutError, logoutResult) {\n            pm.test('Administrator preparation session is cleared', function () {\n                pm.expect(logoutError).to.eql(null);\n                pm.expect(logoutResult.code).to.eql(200);\n                pm.expect(logoutResult.json().ok).to.eql(true);\n            });\n        });\n    });\n}\n\nif (pm.response.code === 200) {\n    var initialized = pm.response.json().initialized;\n    if (initialized === true) {\n        verifyAdministrator();\n    } else if (initialized === false) {\n        pm.sendRequest({\n            url: pm.variables.replaceIn('{{base_url}}/api/admin/setup'),\n            method: 'POST',\n            body: {\n                mode: 'urlencoded',\n                urlencoded: [\n                    {key: 'username', value: pm.variables.get('fr02_admin_username')},\n                    {key: 'password', value: pm.variables.get('fr02_admin_password')}\n                ]\n            }\n        }, function (error, result) {\n            pm.test('Missing administrator is initialized', function () {\n                pm.expect(error).to.eql(null);\n                pm.expect(result.code).to.eql(200);\n                pm.expect(result.json().ok).to.eql(true);\n            });\n            if (!error && result && result.code === 200) verifyAdministrator();\n        });\n    }\n}"
    language: text/javascript
order: 100
