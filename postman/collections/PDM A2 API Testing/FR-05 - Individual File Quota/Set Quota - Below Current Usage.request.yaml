$kind: http-request
url: "{{base_url}}/api/admin/users/{{user_id}}/quota"
method: POST
headers:
  Content-Type: application/json
  Cookie: token={{admin_token}}
body:
  type: json
  content: |-
    {
      "file_quota": "1"
    }
scripts:
  - type: afterResponse
    code: |-
      let response = pm.response.json();
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Quota can be below current usage without deleting files', function () {
          pm.expect(response.file_quota).to.eql(1);
          pm.expect(response.file_count).to.be.above(response.file_quota);
      });
    language: text/javascript
order: 17000
