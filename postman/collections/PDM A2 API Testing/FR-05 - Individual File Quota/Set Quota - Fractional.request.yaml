$kind: http-request
url: '{{base_url}}/api/admin/users/{{user_id}}/quota'
method: POST
headers:
- key: Cookie
  value: token={{admin_token}}
- key: Content-Type
  value: application/json
body:
  type: raw
  content: |-
    {
      "file_quota": "1.5"
    }
  options:
    raw:
      language: json
scripts:
- type: afterResponse
  code: "pm.test(\"Status code is 400\", function () {\r\n    pm.response.to.have.status(400);\r\n});"
  language: text/javascript
order: 5000
