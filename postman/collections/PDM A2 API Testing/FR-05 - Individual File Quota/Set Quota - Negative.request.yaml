$kind: http-request
url: "{{base_url}}/api/admin/users/{{user_id}}/quota"
method: POST
headers:
  - key: Cookie
    value: token={{admin_token}}
body:
  type: urlencoded
  content:
    - key: file_quota
      value: "-1"
      description: ""
      disabled: false
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });"
    language: text/javascript
order: 4000
