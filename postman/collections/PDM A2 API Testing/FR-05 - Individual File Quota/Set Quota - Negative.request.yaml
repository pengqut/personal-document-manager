$kind: http-request
url: '{{base_url}}/api/admin/users/{{user_id}}/quota'
method: POST
headers:
- key: Content-Type
  value: 'application/json'
- key: Cookie
  value: 'token={{admin_token}}'
body:
  type: json
  content: |-
    {
      "file_quota": "-1"
    }
scripts:
- type: afterResponse
  code: |-
    let response = pm.response.json();
    pm.test('Status code is 400', function () { pm.response.to.have.status(400); });
    pm.test('Expected quota result is returned', function () {
        pm.expect(response.error).to.eql('file_quota must be a non-negative integer.');
    });
  language: text/javascript
order: 5000
