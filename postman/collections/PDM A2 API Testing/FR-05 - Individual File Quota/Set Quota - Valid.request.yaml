$kind: http-request
url: '{{base_url}}/api/admin/users/{{user_id}}/quota'
method: POST
headers:
- key: Content-Type
  value: 'application/json'
- key: Cookie
  value: 'token={{admin_token}}'
body:
  type: json
  content: |-
    {
      "file_quota": "5"
    }
scripts:
- type: afterResponse
  code: |-
    let response = pm.response.json();
    pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
    pm.test('Expected quota result is returned', function () {
        pm.expect(response.ok).to.eql(true);
        pm.expect(response.file_quota).to.eql(5);
    });
  language: text/javascript
order: 4000
