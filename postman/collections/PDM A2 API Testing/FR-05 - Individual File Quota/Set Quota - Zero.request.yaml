$kind: http-request
url: "{{base_url}}/api/admin/users/{{user_id}}/quota"
method: POST
headers:
  - key: Cookie
    value: token={{admin_token}}
body:
  type: urlencoded
  content:
    - key: file_quota
      value: "0"
      description: ""
      disabled: false
scripts:
  - type: afterResponse
    code: "let response = pm.response.json();\r

      \r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Zero quota is stored\", function () {\r

      \    pm.expect(response.file_quota).to.eql(0);\r

      });"
    language: text/javascript
order: 2000
