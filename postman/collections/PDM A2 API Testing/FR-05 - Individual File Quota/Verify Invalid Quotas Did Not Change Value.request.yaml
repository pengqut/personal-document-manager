$kind: http-request
url: '{{base_url}}/api/admin/users'
method: GET
headers:
- key: Cookie
  value: 'token={{admin_token}}'
scripts:
- type: afterResponse
  code: |-
    let response = pm.response.json();
    let user = response.users.find(function (item) { return String(item.id) === String(pm.environment.get('user_id')); });
    pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
    pm.test('Previous valid quota remains 5', function () { pm.expect(user.file_quota).to.eql(5); });
  language: text/javascript
order: 9000
