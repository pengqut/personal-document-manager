$kind: http-request
url: '{{base_url}}/api/files'
method: GET
scripts:
- type: afterResponse
  code: 'let data = pm.response.json();

    pm.test(''Status code is 200'', function () { pm.response.to.have.status(200);
    });

    pm.test(''Two test files are present'', function () { pm.expect(data.files.length).to.be.at.least(2);
    });

    if (data.files.length > 0) pm.environment.set(''file_id'', String(data.files[0].id));'
  language: text/javascript
order: 25000
