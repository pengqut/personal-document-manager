$kind: http-request
url: "{{base_url}}/api/upload"
method: POST
headers:
  - key: Cookie
    value: token={{user_token}}
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
      description: "Attach a file larger than max_file_mb. The quota must not be the reason for rejection."
      disabled: false
scripts:
  - type: afterResponse
    code: "let response = pm.response.json();\r

      \r

      pm.test(\"Status code is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Size limit message is returned\", function () {\r

      \    pm.expect(response.error).to.include(\"MB limit\");\r

      });"
    language: text/javascript
order: 6000
