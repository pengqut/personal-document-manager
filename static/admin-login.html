<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Document Manager - Administrator Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-card">
    <h2 class="auth-title">Administrator login</h2>
    <p class="auth-subtitle">Log in to manage the system</p>
    <form id="login-form">
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" id="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <p id="message" class="mb-3 message-error" style="display:none;"></p>
        <button type="submit" id="login-button" class="btn btn-primary w-100">Login</button>
    </form>
</div>
<script>
const form = document.getElementById('login-form');
const button = document.getElementById('login-button');
const message = document.getElementById('message');
form.addEventListener('submit', async function (event) {
    event.preventDefault();
    button.disabled = true;
    message.style.display = 'none';
    const body = new URLSearchParams();
    body.append('username', document.getElementById('username').value);
    body.append('password', document.getElementById('password').value);
    try {
        const res = await fetch('/api/admin/login', { method: 'POST', body: body });
        const data = await res.json();
        if (res.ok) {
            window.location.href = '/admin.html';
        } else {
            message.textContent = data.error || 'Login failed. Please try again.';
            message.style.display = 'block';
        }
    } catch (error) {
        message.textContent = 'Unable to log in. Please try again.';
        message.style.display = 'block';
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
