<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Document Manager - Initial administrator setup</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-card">
    <h2 class="auth-title">Initial administrator setup</h2>
    <p class="auth-subtitle">Create the first administrator account</p>

    <form id="setup-form" style="display:none;">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="e.g. admin001" required>
            <div class="rule-hint">5 to 10 characters. Letters, numbers and underscore only.</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
            <div class="rule-hint">Must include an upper case letter, a lower case letter and a number.</div>
        </div>
        <p id="message" class="mb-3" style="display:none;"></p>
        <button type="submit" id="setup-button" class="btn btn-primary w-100">Create administrator</button>
    </form>

    <p id="status-message" class="mb-3" style="display:none;"></p>
    <p id="login-link" class="auth-link" style="display:none;"><a href="login.html">Go to login</a></p>
</div>

<script>
const form = document.getElementById('setup-form');
const button = document.getElementById('setup-button');
const message = document.getElementById('message');
const statusMessage = document.getElementById('status-message');
const loginLink = document.getElementById('login-link');

function showMessage(text, isError) {
    message.className = 'mb-3 ' + (isError ? 'message-error' : 'message-success');
    message.textContent = text;
    message.style.display = 'block';
}

// Close the entry and point to the login page.
function showClosed(text) {
    form.style.display = 'none';
    statusMessage.className = 'mb-3 message-error';
    statusMessage.textContent = text;
    statusMessage.style.display = 'block';
    loginLink.style.display = 'block';
}

// Check the initialization state before the form can be used.
async function loadStatus() {
    try {
        const res = await fetch('/api/admin/setup-status');
        if (!res.ok) {
            throw new Error('Status check failed.');
        }
        const data = await res.json();
        if (data.initialized) {
            showClosed('Administrator setup is already complete.');
        } else {
            form.style.display = 'block';
        }
    } catch (error) {
        // The form is still hidden here, so the error must be shown in
        // the status message outside the form.
        statusMessage.className = 'mb-3 message-error';
        statusMessage.textContent = 'Unable to check the setup status. Please refresh and try again.';
        statusMessage.style.display = 'block';
    }
}

form.addEventListener('submit', async function (event) {
    event.preventDefault();
    button.disabled = true;

    const body = new URLSearchParams();
    body.append('username', document.getElementById('username').value);
    body.append('password', document.getElementById('password').value);

    try {
        const res = await fetch('/api/admin/setup', { method: 'POST', body: body });
        let data = {};
        try {
            data = await res.json();
        } catch (error) {
            data = {};
        }

        if (res.ok) {
            document.getElementById('password').value = '';
            statusMessage.className = 'mb-3 message-success';
            statusMessage.textContent = 'Administrator account created successfully.';
            statusMessage.style.display = 'block';
            form.style.display = 'none';
            loginLink.style.display = 'block';
        } else if (res.status === 409 && data.error === 'Administrator setup is already complete.') {
            showClosed(data.error);
        } else {
            // Validation and username conflicts keep the form editable.
            showMessage(data.error || 'Setup failed. Please try again.', true);
            button.disabled = false;
        }
    } catch (error) {
        showMessage('Setup failed. Please try again.', true);
        button.disabled = false;
    }
});

loadStatus();
</script>

</body>
</html>
