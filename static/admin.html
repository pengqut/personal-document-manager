<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Document Manager - Administration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-page">
<header class="app-header">
    <h1>Administration</h1>
    <button type="button" id="logout-button" class="btn-outline-small">Log out</button>
</header>
<main class="app-content">
    <p id="message">Loading account...</p>
    <section class="mt-4">
        <h2>Normal Users</h2>
        <table class="table table-bordered">
            <thead><tr><th>Username</th><th>Status</th><th>File Quota</th><th>File Count</th><th>Action</th></tr></thead>
            <tbody id="users-body"></tbody>
        </table>
        <p id="users-message"></p>
    </section>
</main>
<script>
const message = document.getElementById('message');
const usersBody = document.getElementById('users-body');
const usersMessage = document.getElementById('users-message');

async function loadUsers() {
    try {
        const res = await fetch('/api/admin/users');
        if (!res.ok) {
            usersMessage.textContent = 'Unable to load users.';
            return;
        }
        const data = await res.json();
        usersBody.innerHTML = '';
        if (data.users.length === 0) {
            usersMessage.textContent = 'No normal users found.';
            return;
        }
        usersMessage.textContent = '';
        data.users.forEach(function (user) {
            const row = document.createElement('tr');
            [user.username, user.enabled ? 'Enabled' : 'Disabled', user.file_quota, user.file_count].forEach(function (value) {
                const cell = document.createElement('td');
                cell.textContent = value;
                row.appendChild(cell);
            });
            const actionCell = document.createElement('td');

            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = user.enabled ? 'Disable' : 'Enable';

            button.addEventListener('click', function () {
                changeStatus(user.id, !user.enabled);
            });

            actionCell.appendChild(button);

            const quotaInput = document.createElement('input');
            quotaInput.type = 'number';
            quotaInput.min = '0';
            quotaInput.step = '1';
            quotaInput.value = user.file_quota;

            const quotaButton = document.createElement('button');
            quotaButton.type = 'button';
            quotaButton.textContent = 'Set quota';
            quotaButton.addEventListener('click', function () {
                setQuota(user.id, quotaInput.value);
            });

            actionCell.appendChild(quotaInput);
            actionCell.appendChild(quotaButton);
            row.appendChild(actionCell);
            usersBody.appendChild(row);
        });
    } catch (error) {
        usersMessage.textContent = 'Unable to load users.';
    }
}
    async function changeStatus(userId, enabled) {
        try {
            const body = new URLSearchParams();
            body.append('enabled', enabled ? 'true' : 'false');

            const res = await fetch('/api/admin/users/' + userId + '/status', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: body
            });

            if (!res.ok) {
                const data = await res.json();
                usersMessage.textContent = data.error || 'Unable to update user status.';
                return;
            }

            usersMessage.textContent = enabled
                ? 'User enabled successfully.'
                : 'User disabled successfully.';

            loadUsers();

        } catch (error) {
            usersMessage.textContent = 'Unable to update user status.';
        }
    }

    async function setQuota(userId, fileQuota) {
        try {
            const body = new URLSearchParams();
            body.append('file_quota', fileQuota);

            const res = await fetch('/api/admin/users/' + userId + '/quota', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: body
            });

            const data = await res.json();
            if (!res.ok) {
                usersMessage.textContent = data.error || 'Unable to update the file quota.';
                return;
            }

            usersMessage.textContent = 'File quota updated to ' + data.file_quota + '.';
            loadUsers();
        } catch (error) {
            usersMessage.textContent = 'Unable to update the file quota.';
        }
    }
(async function () {
    try {
        const res = await fetch('/api/admin/me');
        if (res.status === 401 || res.status === 409) {
            window.location.href = '/admin-login.html';
        } else if (res.ok) {
            const data = await res.json();
            message.textContent = 'Signed in as ' + data.username;
            loadUsers();
        } else {
            message.textContent = 'Unable to load your account.';
        }
    } catch (error) {
        message.textContent = 'Unable to load your account. Please refresh and try again.';
    }
})();
document.getElementById('logout-button').addEventListener('click', async function () {
    try {
        const res = await fetch('/api/logout', { method: 'POST' });
        if (res.ok) {
            window.location.href = '/admin-login.html';
        } else {
            message.textContent = 'Unable to log out. Please try again.';
        }
    } catch (error) {
        message.textContent = 'Unable to log out. Please try again.';
    }
});
</script>
</body>
</html>
