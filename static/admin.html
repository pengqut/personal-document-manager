<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Document Manager - Administration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-page">
<header class="app-header">
    <h1>Administration</h1>
    <button type="button" id="logout-button" class="btn-outline-small">Log out</button>
</header>
<main class="app-content">
    <p id="message">Loading account...</p>
</main>
<script>
const message = document.getElementById('message');
(async function () {
    try {
        const res = await fetch('/api/admin/me');
        if (res.status === 401 || res.status === 409) {
            window.location.href = '/admin-login.html';
        } else if (res.ok) {
            const data = await res.json();
            message.textContent = 'Signed in as ' + data.username;
        } else {
            message.textContent = 'Unable to load your account.';
        }
    } catch (error) {
        message.textContent = 'Unable to load your account. Please refresh and try again.';
    }
})();
document.getElementById('logout-button').addEventListener('click', async function () {
    try {
        const res = await fetch('/api/logout', { method: 'POST' });
        if (res.ok) {
            window.location.href = '/admin-login.html';
        } else {
            message.textContent = 'Unable to log out. Please try again.';
        }
    } catch (error) {
        message.textContent = 'Unable to log out. Please try again.';
    }
});
</script>
</body>
</html>
