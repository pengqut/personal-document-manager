<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Document Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/min/dropzone.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-page">

<div class="app-header">
    <h1>Personal Document Manager</h1>
    <a href="#" id="logout-link">Log out</a>
</div>

<div class="app-content">

    <p id="action-message" class="action-message" style="display:none;"></p>

    <div id="upload-box" class="upload-card">
        <div class="dz-message">
            <p class="upload-title">Click or drag a file here to upload</p>
            <p class="upload-hint" id="quota-hint">Loading limits...</p>
            <p id="upload-message" style="display:none;"></p>
        </div>
    </div>

    <div class="category-tabs" id="category-tabs"></div>

    <div id="file-list">
        <table class="file-table">
            <thead>
                <tr>
                    <th class="sort" data-sort="filename">Name</th>
                    <th>Category</th>
                    <th class="sort" data-sort="uploaded_at">Uploaded</th>
                    <th class="sort" data-sort="sizebytes">Size</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody class="list" id="file-table-body"></tbody>
        </table>
        <p id="empty-message" class="empty-message" style="display:none;">No files in this category yet</p>
    </div>

</div>

<div id="category-dialog" class="dialog-overlay" style="display:none;">
    <div class="dialog-card">
        <h2 class="dialog-title">Change category</h2>
        <p class="dialog-subtitle" id="category-dialog-filename"></p>
        <select id="category-dialog-select" class="dialog-select"></select>
        <div class="dialog-actions">
            <button type="button" class="btn-outline" id="category-dialog-cancel">Cancel</button>
            <button type="button" class="btn-solid-primary" id="category-dialog-save">Save</button>
        </div>
    </div>
</div>

<div id="delete-dialog" class="dialog-overlay" style="display:none;">
    <div class="dialog-card">
        <h2 class="dialog-title">Delete this file?</h2>
        <p class="dialog-text">This will permanently delete <span id="delete-dialog-filename"></span>.</p>
        <p class="dialog-text">This action cannot be undone.</p>
        <div class="dialog-actions">
            <button type="button" class="btn-outline" id="delete-dialog-cancel">Cancel</button>
            <button type="button" class="btn-solid-danger" id="delete-dialog-confirm">Delete</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/min/dropzone.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/list.js/2.3.1/list.min.js"></script>
<script>

Dropzone.autoDiscover = false;

const quotaHint = document.getElementById('quota-hint');
const uploadMessage = document.getElementById('upload-message');
let limits = { max_file_mb: 0, user_file_limit: 0, used: 0 };

function showUploadMessage(text, isError) {
    uploadMessage.className = isError ? 'message-error' : 'message-success';
    uploadMessage.textContent = text;
    uploadMessage.style.display = 'block';
}

function updateHint() {
    const remaining = limits.user_file_limit - limits.used;
    quotaHint.textContent = 'Max file size: ' + limits.max_file_mb + ' MB' +
        '  ·  Remaining quota: ' + remaining + ' / ' + limits.user_file_limit + ' files';
}

async function loadLimits() {
    const res = await fetch('/api/limits');
    if (!res.ok) {
        window.location.href = 'login.html';
        return;
    }
    limits = await res.json();
    updateHint();
    setupDropzone();
}

function setupDropzone() {
    const dropzone = new Dropzone('#upload-box', {
        url: '/api/upload',
        paramName: 'file',
        maxFilesize: limits.max_file_mb,
        previewsContainer: false,
        dictFileTooBig: 'This file is {{filesize}} MB, which is over the {{maxFilesize}} MB limit.'
    });

    dropzone.on('success', function (file, res) {
        showUploadMessage('Uploaded successfully. Category: ' + res.category, false);
        limits.used += 1;
        updateHint();
        loadFiles();
    });

    dropzone.on('error', function (file, errorText) {
        const text = (errorText && errorText.error) ? errorText.error : errorText;
        showUploadMessage(text, true);
    });
}

document.getElementById('logout-link').addEventListener('click', async function (event) {
    event.preventDefault();
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = 'login.html';
});

const CATEGORY_TABS = [
    { value: 'all', label: 'All' },
    { value: 'document', label: 'Documents' },
    { value: 'image', label: 'Images' },
    { value: 'audio', label: 'Audio' },
    { value: 'video', label: 'Video' },
    { value: 'other', label: 'Other' }
];
const CATEGORY_LABELS = { document: 'Documents', image: 'Images', audio: 'Audio', video: 'Video', other: 'Other' };

const categoryTabs = document.getElementById('category-tabs');
const emptyMessage = document.getElementById('empty-message');

let activeCategory = 'all';

function formatSize(bytes) {
    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + ' KB';
    }
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

const fileList = new List('file-list', {
    valueNames: [
        'id',
        'filename',
        { name: 'download-link', attr: 'href' },
        'category_label',
        'uploaded_at',
        'size',
        { data: ['category'] },
        { data: ['sizebytes'] }
    ],
    item: '<tr>' +
        '<td class="id" style="display:none;"></td>' +
        '<td><a class="download-link" href="#"><span class="filename"></span></a></td>' +
        '<td class="category_label"></td>' +
        '<td class="uploaded_at"></td>' +
        '<td class="size"></td>' +
        '<td class="actions-cell">' +
        '<button type="button" class="btn-outline-small btn-change-category">Change category</button>' +
        '<button type="button" class="btn-outline-small btn-delete">Delete</button>' +
        '</td>' +
        '</tr>'
});

fileList.on('updated', function () {
    emptyMessage.style.display = fileList.visibleItems.length === 0 ? 'block' : 'none';
});

function renderTabs() {
    categoryTabs.innerHTML = '';
    CATEGORY_TABS.forEach(function (tab) {
        const button = document.createElement('button');
        button.className = 'category-tab' + (tab.value === activeCategory ? ' active' : '');
        button.textContent = tab.label;
        button.addEventListener('click', function () {
            activeCategory = tab.value;
            renderTabs();
            applyCategoryFilter();
        });
        categoryTabs.appendChild(button);
    });
}

function applyCategoryFilter() {
    if (activeCategory === 'all') {
        fileList.filter();
    } else {
        fileList.filter(function (item) {
            return item.values().category === activeCategory;
        });
    }
}

async function loadFiles() {
    const res = await fetch('/api/files');
    if (!res.ok) {
        return;
    }
    const data = await res.json();
    fileList.clear();
    fileList.add(data.files.map(function (file) {
        return {
            id: file.id,
            filename: file.filename,
            'download-link': '/api/download/' + file.id,
            category: file.category,
            category_label: CATEGORY_LABELS[file.category] || file.category,
            uploaded_at: file.uploaded_at.split(' ')[0],
            size: formatSize(file.size),
            sizebytes: file.size
        };
    }));
    applyCategoryFilter();
}

const actionMessage = document.getElementById('action-message');
function showActionMessage(text, isError) {
    actionMessage.className = 'action-message ' + (isError ? 'message-error' : 'message-success');
    actionMessage.textContent = text;
    actionMessage.style.display = 'block';
}

const categorySelect = document.getElementById('category-dialog-select');
Object.keys(CATEGORY_LABELS).forEach(function (category) {
    const option = document.createElement('option');
    option.value = category;
    option.textContent = CATEGORY_LABELS[category];
    categorySelect.appendChild(option);
});

const categoryDialog = document.getElementById('category-dialog');
const deleteDialog = document.getElementById('delete-dialog');
let activeFileId = null;

function openCategoryDialog(fileId, filename, currentCategory) {
    activeFileId = fileId;
    document.getElementById('category-dialog-filename').textContent = 'File: ' + filename;
    categorySelect.value = currentCategory;
    categoryDialog.style.display = 'flex';
}

function openDeleteDialog(fileId, filename) {
    activeFileId = fileId;
    document.getElementById('delete-dialog-filename').textContent = filename;
    deleteDialog.style.display = 'flex';
}

function closeDialogs() {
    categoryDialog.style.display = 'none';
    deleteDialog.style.display = 'none';
    activeFileId = null;
}

document.getElementById('file-list').addEventListener('click', function (event) {
    const row = event.target.closest('tr');
    if (!row) {
        return;
    }
    const fileId = row.querySelector('.id').textContent;
    const filename = row.querySelector('.filename').textContent;

    if (event.target.classList.contains('btn-change-category')) {
        openCategoryDialog(fileId, filename, row.dataset.category);
    } else if (event.target.classList.contains('btn-delete')) {
        openDeleteDialog(fileId, filename);
    }
});

document.getElementById('category-dialog-cancel').addEventListener('click', closeDialogs);
document.getElementById('delete-dialog-cancel').addEventListener('click', closeDialogs);

document.getElementById('category-dialog-save').addEventListener('click', async function () {
    const fileId = activeFileId;
    const res = await fetch('/api/files/' + fileId + '/category', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'category=' + encodeURIComponent(categorySelect.value)
    });
    closeDialogs();
    if (res.ok) {
        showActionMessage('Category updated successfully.', false);
        loadFiles();
    } else {
        const data = await res.json();
        showActionMessage(data.error || 'Could not update the category.', true);
    }
});

document.getElementById('delete-dialog-confirm').addEventListener('click', async function () {
    const fileId = activeFileId;
    const res = await fetch('/api/files/' + fileId + '/delete', { method: 'POST' });
    closeDialogs();
    if (res.ok) {
        showActionMessage('File deleted successfully.', false);
        limits.used -= 1;
        updateHint();
        loadFiles();
    } else {
        const data = await res.json();
        showActionMessage(data.error || 'Could not delete the file.', true);
    }
});

loadLimits();
renderTabs();
loadFiles();
</script>

</body>
</html>
