<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Document Manager - Home</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="max-width: 500px; margin-top: 80px;">
    <div class="card p-4">
        <h4>Welcome, <span id="username"></span></h4>
        <p class="text-muted">The file list will be added here in a later task.</p>
        <button id="logout-button" class="btn btn-outline-secondary">Logout</button>
    </div>
</div>

<script>
// If there is no logged in user, send the visitor back to the login page.
async function checkLogin() {
    const res = await fetch('/api/me');
    if (!res.ok) {
        window.location.href = 'login.html';
        return;
    }
    const data = await res.json();
    document.getElementById('username').textContent = data.username;
}

document.getElementById('logout-button').addEventListener('click', async function () {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = 'login.html';
});

checkLogin();
</script>

</body>
</html>
