<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Document Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/min/dropzone.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-page">

<div class="app-header">
    <h1>Personal Document Manager</h1>
    <a href="#" id="logout-link">Log out</a>
</div>

<div class="app-content">

    <div id="upload-box" class="upload-card">
        <div class="dz-message">
            <p class="upload-title">Click or drag a file here to upload</p>
            <p class="upload-hint" id="quota-hint">Loading limits...</p>
            <p id="upload-message" style="display:none;"></p>
        </div>
    </div>

    <div class="category-tabs" id="category-tabs"></div>

    <div id="file-list">
        <table class="file-table">
            <thead>
                <tr>
                    <th class="sort" data-sort="filename">Name</th>
                    <th>Category</th>
                    <th class="sort" data-sort="uploaded_at">Uploaded</th>
                    <th class="sort" data-sort="sizebytes">Size</th>
                </tr>
            </thead>
            <tbody class="list" id="file-table-body"></tbody>
        </table>
        <p id="empty-message" class="empty-message" style="display:none;">No files in this category yet</p>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/min/dropzone.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/list.js/2.3.1/list.min.js"></script>
<script>
// Attach Dropzone by hand
Dropzone.autoDiscover = false;

const quotaHint = document.getElementById('quota-hint');
const uploadMessage = document.getElementById('upload-message');
let limits = { max_file_mb: 0, user_file_limit: 0, used: 0 };

// Show an upload message
function showUploadMessage(text, isError) {
    uploadMessage.className = isError ? 'message-error' : 'message-success';
    uploadMessage.textContent = text;
    uploadMessage.style.display = 'block';
}

// Update the quota hint
function updateHint() {
    const remaining = limits.user_file_limit - limits.used;
    quotaHint.textContent = 'Max file size: ' + limits.max_file_mb + ' MB' +
        '  ·  Remaining quota: ' + remaining + ' / ' + limits.user_file_limit + ' files';
}

// Load the upload limits
async function loadLimits() {
    const res = await fetch('/api/limits');
    if (!res.ok) {
        window.location.href = 'login.html';
        return;
    }
    limits = await res.json();
    updateHint();
    setupDropzone();
}

// Set up the dropzone
function setupDropzone() {
    const dropzone = new Dropzone('#upload-box', {
        url: '/api/upload',
        paramName: 'file',
        maxFilesize: limits.max_file_mb,
        previewsContainer: false,
        dictFileTooBig: 'This file is {{filesize}} MB, which is over the {{maxFilesize}} MB limit.'
    });

    dropzone.on('success', function (file, res) {
        showUploadMessage('Uploaded successfully. Category: ' + res.category, false);
        limits.used += 1;
        updateHint();
        loadFiles();
    });

    dropzone.on('error', function (file, errorText) {
        // A server error comes back as {error: "..."}. A client side check
        // (like the file size check above) comes back as plain text.
        const text = (errorText && errorText.error) ? errorText.error : errorText;
        showUploadMessage(text, true);
    });
}

document.getElementById('logout-link').addEventListener('click', async function (event) {
    event.preventDefault();
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = 'login.html';
});

// The five categories from requirement R4, plus an "all" tab
const CATEGORY_TABS = [
    { value: 'all', label: 'All' },
    { value: 'document', label: 'Documents' },
    { value: 'image', label: 'Images' },
    { value: 'audio', label: 'Audio' },
    { value: 'video', label: 'Video' },
    { value: 'other', label: 'Other' }
];
const CATEGORY_LABELS = { document: 'Documents', image: 'Images', audio: 'Audio', video: 'Video', other: 'Other' };

const categoryTabs = document.getElementById('category-tabs');
const emptyMessage = document.getElementById('empty-message');

let activeCategory = 'all';

// Turn a byte count into a readable size
function formatSize(bytes) {
    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + ' KB';
    }
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

const fileList = new List('file-list', {
    valueNames: ['filename', 'category_label', 'uploaded_at', 'size', { data: ['category'] }, { data: ['sizebytes'] }],
    item: '<tr><td class="filename"></td><td class="category_label"></td><td class="uploaded_at"></td><td class="size"></td></tr>'
});

// Show the "no files" message whenever a filter or sort leaves the list empty
fileList.on('updated', function () {
    emptyMessage.style.display = fileList.visibleItems.length === 0 ? 'block' : 'none';
});

// Build the category tab buttons
function renderTabs() {
    categoryTabs.innerHTML = '';
    CATEGORY_TABS.forEach(function (tab) {
        const button = document.createElement('button');
        button.className = 'category-tab' + (tab.value === activeCategory ? ' active' : '');
        button.textContent = tab.label;
        button.addEventListener('click', function () {
            activeCategory = tab.value;
            renderTabs();
            applyCategoryFilter();
        });
        categoryTabs.appendChild(button);
    });
}

// Show only the files that match the active tab
function applyCategoryFilter() {
    if (activeCategory === 'all') {
        fileList.filter();
    } else {
        fileList.filter(function (item) {
            return item.values().category === activeCategory;
        });
    }
}

// Load the file list
async function loadFiles() {
    const res = await fetch('/api/files');
    if (!res.ok) {
        return;
    }
    const data = await res.json();
    fileList.clear();
    fileList.add(data.files.map(function (file) {
        return {
            filename: file.filename,
            category: file.category,
            category_label: CATEGORY_LABELS[file.category] || file.category,
            uploaded_at: file.uploaded_at.split(' ')[0],
            size: formatSize(file.size),
            sizebytes: file.size
        };
    }));
    applyCategoryFilter();
}

loadLimits();
renderTabs();
loadFiles();
</script>

</body>
</html>
