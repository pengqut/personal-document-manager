<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Document Manager - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-card">
    <h2 class="auth-title">Personal Document Manager</h2>
    <p class="auth-subtitle">Log in to manage your files</p>

    <form id="login-form">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="e.g. alice123" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <p id="message" class="mb-3" style="display:none;"></p>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <p class="auth-link">Don't have an account? <a href="register.html">Register</a></p>
</div>

<script>
const form = document.getElementById('login-form');
const message = document.getElementById('message');

function showMessage(text, isError) {
    message.className = 'mb-3 ' + (isError ? 'message-error' : 'message-success');
    message.textContent = text;
    message.style.display = 'block';
}

form.addEventListener('submit', async function (event) {
    event.preventDefault();

    const body = new URLSearchParams();
    body.append('username', document.getElementById('username').value);
    body.append('password', document.getElementById('password').value);

    const res = await fetch('/api/login', { method: 'POST', body: body });
    const data = await res.json();

    if (res.ok) {
        showMessage('Login successful. Redirecting...', false);
        setTimeout(function () {
            window.location.href = 'home.html';
        }, 600);
    } else {
        showMessage(data.error, true);
    }
});
</script>

</body>
</html>
