<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Document Manager - Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-card">
    <h2 class="auth-title">Create your account</h2>
    <p class="auth-subtitle">Register to start organising your files</p>

    <form id="register-form">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="e.g. alice123" required>
            <div class="rule-hint">6 to 10 characters. Letters, numbers and underscore only.</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
            <div class="rule-hint">Must include an upper case letter, a lower case letter and a number.</div>
        </div>
        <p id="message" class="mb-3" style="display:none;"></p>
        <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>

    <p class="auth-link">Already have an account? <a href="login.html">Log in</a></p>
</div>

<script>
// Sends the register form to the backend and shows a message with the result.
const form = document.getElementById('register-form');
const message = document.getElementById('message');

function showMessage(text, isError) {
    message.className = 'mb-3 ' + (isError ? 'message-error' : 'message-success');
    message.textContent = text;
    message.style.display = 'block';
}

form.addEventListener('submit', async function (event) {
    event.preventDefault();

    const body = new URLSearchParams();
    body.append('username', document.getElementById('username').value);
    body.append('password', document.getElementById('password').value);

    const res = await fetch('/api/register', { method: 'POST', body: body });
    const data = await res.json();

    if (res.ok) {
        showMessage('Account created successfully. You can now log in.', false);
        form.reset();
    } else {
        showMessage(data.error, true);
    }
});
</script>

</body>
</html>
